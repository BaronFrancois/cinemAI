<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CinemAI — Odyssey</title>
<style>
:root{--bg:#080b0f;--panel:#0f1319;--panel2:#151a21;--line:#27303a;--text:#edf2f5;--muted:#8793a0;--mint:#bfe2d8;--mint2:#76b9a8;--amber:#e3b86c;--r:14px}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{color:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr;overflow:hidden}.topbar{display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:#0b0f13}.brand{font:700 18px Georgia,serif;letter-spacing:.03em}.brand i{color:var(--mint);font-style:normal}.project-head{min-width:0;flex:1}.project-head strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-head small,.meta{color:var(--muted);font-size:12px}.status{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}.guide{color:var(--mint);text-decoration:none;border:1px solid #35584e;border-radius:10px;padding:7px 10px;font-size:12px}.shell{min-height:0;display:grid;grid-template-columns:78px minmax(430px,1fr) minmax(330px,410px)}.rail{border-right:1px solid var(--line);background:#0b0f13;padding:14px 8px;display:flex;flex-direction:column;gap:7px}.rail-item{border:1px solid transparent;background:transparent;border-radius:12px;min-height:55px;padding:7px 3px;display:grid;place-items:center;gap:2px;color:var(--muted);cursor:pointer;font-size:10px}.rail-item span:first-child{font-size:18px}.rail-item:hover{background:var(--panel2);color:var(--text)}.rail-item[aria-selected="true"]{border-color:#385d52;background:#12201c;color:var(--mint)}main{min-width:0;min-height:0;overflow:auto;padding:28px}.page{max-width:1100px;margin:auto}.eyebrow{color:var(--mint2);letter-spacing:.14em;text-transform:uppercase;font-size:11px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font:500 clamp(26px,3vw,39px) Georgia,serif;margin:6px 0}p{line-height:1.55}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#11171d,#0e1217);border:1px solid var(--line);border-radius:var(--r);padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric{font-size:28px;font-family:Georgia,serif}.empty{min-height:270px;display:grid;place-items:center;text-align:center;border:1px dashed #34404c;border-radius:var(--r);padding:32px;background:rgba(255,255,255,.012)}.empty-inner{max-width:480px}.empty .mark{font:500 44px Georgia,serif;color:var(--mint)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 12px;cursor:pointer}.btn:hover{border-color:#496457}.btn.primary{background:var(--mint);border-color:var(--mint);color:#092019;font-weight:700}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-title h2{font:500 20px Georgia,serif;margin:0}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.item-main{min-width:0;flex:1}.item strong,.item small{display:block}.item small{color:var(--muted);margin-top:3px}.tag{font-size:11px;color:var(--mint);border:1px solid #35584e;border-radius:999px;padding:4px 7px}.timeline{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#0b0f13}.track{display:grid;grid-template-columns:110px minmax(500px,1fr);min-height:54px;border-bottom:1px solid var(--line)}.track:last-child{border:0}.track-name{padding:17px 12px;color:var(--muted);font-size:12px;border-right:1px solid var(--line)}.clips{padding:8px;display:flex;gap:6px;align-items:center}.clip{min-width:80px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px;border:1px solid #3b655a;border-radius:9px;background:#152621;color:var(--mint);font-size:11px}.assistant{min-height:0;border-left:1px solid var(--line);background:#0c1014;display:grid;grid-template-rows:auto 1fr auto}.assistant-head{padding:17px 18px;border-bottom:1px solid var(--line)}.assistant-head strong{font-family:Georgia,serif}.assistant-body{overflow:auto;padding:14px}.thread{display:grid;gap:12px}.message{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);font-size:14px;line-height:1.5}.message.user{margin-left:34px;background:#14201d}.chat-source{display:block;color:var(--muted);font-size:10px;margin-top:7px}.approval{border:1px solid #685835;border-radius:12px;padding:13px;background:#1b1811}.approval h3{font-size:14px;margin:0 0 6px}.approval pre{white-space:pre-wrap;max-height:130px;overflow:auto;color:#c8d1d8;font-size:11px}.composer{border-top:1px solid var(--line);padding:12px}.composer-box{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px}.composer textarea{min-height:42px;max-height:130px;resize:vertical;flex:1;border:0;outline:0;background:transparent;color:var(--text)}.composer .send{width:38px;height:38px;border:0;border-radius:9px;background:var(--mint);color:#092019;font-weight:900;cursor:pointer}.error{color:#f1a1a1;font-size:12px;margin-top:7px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#151b22;display:none;z-index:5}.toast.show{display:block}.spinner{opacity:.65;pointer-events:none}
@media(max-width:900px){.app{grid-template-rows:52px 1fr 66px}.topbar{padding:0 12px}.guide,.status .pill:first-child{display:none}.shell{display:block;overflow-y:auto;overflow-x:hidden}.rail{position:fixed;z-index:4;bottom:0;left:0;right:0;height:66px;border:0;border-top:1px solid var(--line);padding:5px;display:grid;grid-template-columns:repeat(6,1fr)}.rail-item{min-height:54px}.shell main{overflow:visible;padding:20px 14px;width:100%;min-width:0}.page,.timeline{max-width:100%;min-width:0}.assistant{border-left:0;border-top:1px solid var(--line);min-height:620px}.grid{grid-template-columns:1fr}.topbar{position:sticky;top:0;z-index:3}.project-head small{display:none}}
</style></head><body><div class="app"><header class="topbar"><div class="brand">Cinem<i>AI</i></div><div class="project-head"><strong id="project-title">Projet sans titre</strong><small id="project-meta">Espace de production vide</small></div><div class="status"><span class="pill" id="revision">Révision 0</span><span class="pill" id="queue-pill">0 tâche</span><a class="guide" href="/test-guide.html">Guide de test</a></div></header><div class="shell"><nav class="rail" aria-label="Espaces de travail"><button class="rail-item" data-tab="projet" aria-selected="true"><span>◇</span><span>Projet</span></button><button class="rail-item" data-tab="script" aria-selected="false"><span>§</span><span>Script</span></button><button class="rail-item" data-tab="production" aria-selected="false"><span>▶</span><span>Production</span></button><button class="rail-item" data-tab="personnages" aria-selected="false"><span>♙</span><span>Personnages</span></button><button class="rail-item" data-tab="decors" aria-selected="false"><span>⌂</span><span>Décors</span></button><button class="rail-item" data-tab="export" aria-selected="false"><span>↗</span><span>Export</span></button></nav><main><div id="workspace" class="page"></div></main><aside class="assistant"><div class="assistant-head"><strong>Copilote de réalisation</strong><div class="meta" id="assistant-context">Contexte · Projet</div></div><div class="assistant-body"><div id="thread" class="thread" data-thread></div></div><form class="composer" id="composer"><div class="composer-box"><textarea id="composer-input" placeholder="Décrivez ce que vous voulez créer ou corriger…" aria-label="Message au copilote"></textarea><button class="send" aria-label="Envoyer">↑</button></div><div id="composer-error" class="error" role="alert"></div></form></aside></div></div><div class="toast" id="toast"></div>
<script>
const tabs={projet:'Projet',script:'Script',production:'Production',personnages:'Personnages',decors:'Décors',export:'Export'},trackLabels={visual:'Image / vidéo',dialogue:'Dialogues',voiceover:'Voix off',sfx:'Bruitages',ambience:'Ambiances',music:'Musique'};let activeTab='projet',state=null,history=[],sending=false;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),body=await r.json().catch(()=>({error:'Réponse illisible'}));if(!r.ok)throw new Error(body.error||`Erreur ${r.status}`);return body}function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}function pending(){return(state?.approvals||[]).filter(x=>x.status==='pending')}function jobs(){return state?.queue||[]}function empty(title,text,action='Parler au copilote'){return `<div class="empty"><div class="empty-inner"><div class="mark">◇</div><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="actions"><button class="btn primary" data-focus-composer>${esc(action)}</button></div></div></div>`}function header(kicker,title,desc){return `<div class="title-row"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></div></div>`}function list(items,render){return items.length?`<div class="list">${items.map(render).join('')}</div>`:''}
function renderProject(){const p=state.project||{},has=p.title||p.brief;return header('Fondation','Projet','Cadrez l’intention, les contraintes et le format avant la génération.')+(has?`<div class="grid"><div class="card"><div class="meta">Titre</div><div class="metric">${esc(p.title||'Sans titre')}</div></div><div class="card"><div class="meta">Format</div><p>${esc(p.aspectRatio||'Non défini')} · ${esc(p.durationSeconds||0)} s</p></div></div><div class="section-title"><h2>Brief</h2></div><div class="card"><p>${esc(p.brief||'Aucun brief')}</p></div>`:empty('Commencez par l’intention','Aucun contenu narratif n’est préchargé. Décrivez le but, le public, le format et les contraintes.'))}function renderScript(){const sequences=state.sequences||[],shots=state.shots||[];if(!sequences.length&&!shots.length)return header('Narration','Script & plans','Structurez le récit avant de générer les médias.')+empty('Aucune séquence','Demandez au copilote de découper le projet en séquences et en plans contrôlables.');return header('Narration','Script & plans',`${sequences.length} séquence(s), ${shots.length} plan(s).`)+list(sequences,s=>`<div class="item"><div class="item-main"><strong>${esc(s.title||s.id)}</strong><small>${esc(s.summary||'Sans résumé')}</small></div><span class="tag">${esc(s.id)}</span></div>`)+`<div class="section-title"><h2>Plans</h2></div>`+list(shots,s=>`<div class="item"><div class="item-main"><strong>${esc(s.title||s.id)}</strong><small>${esc(s.description||'Sans description')} · ${esc(s.durationSeconds||0)} s</small></div><span class="tag">${esc(s.status||'draft')}</span></div>`)}function timeline(){const tracks=state.timeline?.tracks||[];return `<div class="timeline">${tracks.map(t=>`<div class="track"><div class="track-name">${esc(trackLabels[t.kind]||t.kind)}</div><div class="clips">${(t.clips||[]).map(c=>`<div class="clip" title="${esc(c.id)}">${esc(c.label||c.assetId||c.shotId||c.id)}</div>`).join('')||'<span class="meta">Piste vide</span>'}</div></div>`).join('')}</div>`}function renderProduction(){const js=jobs();return header('Régie','Production','Les générations sont préparées, approuvées puis suivies ici.')+`<div class="grid"><div class="card"><div class="meta">Durée canonique</div><div class="metric">${esc(state.timeline?.durationSeconds||0)} s</div></div><div class="card"><div class="meta">File de production</div><div class="metric">${js.length}</div></div></div><div class="section-title"><h2>Timeline commune</h2></div>${timeline()}<div class="section-title"><h2>File de production</h2></div>`+(js.length?list(js,j=>`<div class="item"><div class="item-main"><strong>${esc(j.label)} · ${esc(j.targetId)}</strong><small>${esc(j.status)} · ${esc(j.strategy)}</small></div>${['pending','running','review'].includes(j.status)?`<button class="btn" data-job="${esc(j.id)}" data-job-status="${j.status==='pending'?'running':j.status==='running'?'review':'succeeded'}">Avancer</button>`:''}</div>`):empty('Aucune génération en attente','Le copilote peut préparer une génération image, vidéo ou audio. Elle restera bloquée jusqu’à approbation.','Préparer une génération'))}function renderAssets(kind,title,desc){const xs=(state.assets||[]).filter(a=>a.kind===kind);return header('Bibliothèque',title,desc)+(xs.length?list(xs,a=>`<div class="item"><div class="item-main"><strong>${esc(a.name||a.id)}</strong><small>${esc(a.description||'Sans description')}</small></div><span class="tag">${esc(a.id)}</span></div>`):empty(`Aucun ${kind==='character'?'personnage':'décor'}`,`Ajoutez vos références ou demandez au copilote de définir les assets nécessaires.`,`Définir ${kind==='character'?'un personnage':'un décor'}`))}function renderExport(){return header('Livraison','Export','Cette vue lit la même timeline canonique que la production : aucune divergence silencieuse.')+`<div class="grid"><div class="card"><div class="meta">Durée</div><div class="metric">${esc(state.timeline?.durationSeconds||0)} s</div></div><div class="card"><div class="meta">Statut</div><p>${jobs().some(j=>j.status!=='succeeded')?'Production incomplète':'Prêt pour contrôle final'}</p></div></div><div class="section-title"><h2>Pistes livrables</h2></div>${timeline()}<p class="muted">L’export YouTube et les rendus payants ne sont pas activés dans ce MVP.</p>`}
function render(){if(!state)return;$('#project-title').textContent=state.project?.title||'Projet sans titre';$('#project-meta').textContent=state.project?.brief?'Manifeste de production':'Espace de production vide';$('#revision').textContent=`Révision ${state.revision||0}`;$('#queue-pill').textContent=`${jobs().length} tâche${jobs().length>1?'s':''}`;$('#assistant-context').textContent=`Contexte · ${tabs[activeTab]}`;document.querySelectorAll('.rail-item').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===activeTab)));const views={projet:renderProject,script:renderScript,production:renderProduction,personnages:()=>renderAssets('character','Personnages','Identités stables et références réutilisables.'),decors:()=>renderAssets('location','Décors','Lieux stables, cadrages et continuité spatiale.'),export:renderExport};$('#workspace').innerHTML=views[activeTab]();renderApprovals()}function renderApprovals(){const root=$('#thread'),ps=pending(),messages=history.map(m=>`<div class="message ${m.role==='user'?'user':''}">${esc(m.text)}${m.source?`<span class="chat-source">${esc(m.source)}</span>`:''}</div>`).join(''),cards=ps.map(p=>`<div class="approval"><div class="meta">Action proposée · ${esc(p.operation?.name)}</div><h3>${esc(p.operation?.name)}</h3><pre>${esc(JSON.stringify(p.operation?.args||{},null,2))}</pre><div class="actions"><button class="btn primary" data-decision="approve" data-proposal="${esc(p.id)}">Valider</button><button class="btn" data-decision="reject" data-proposal="${esc(p.id)}">Refuser</button></div></div>`).join('');root.dataset.thread=activeTab;root.innerHTML=messages+cards||`<div class="empty"><div class="empty-inner"><div class="mark">✦</div><p>Décrivez votre intention. Le copilote proposera des actions structurées, sans modifier le projet avant votre validation.</p></div></div>`;root.parentElement.scrollTop=root.parentElement.scrollHeight}async function load(){state=(await api('/api/workspace')).manifest;render()}async function sendMessage(message){if(sending||!message.trim())return;sending=true;$('#composer').classList.add('spinner');$('#composer-error').textContent='';history.push({role:'user',text:message.trim()});renderApprovals();try{const out=await api('/api/chat',{method:'POST',body:JSON.stringify({tab:activeTab,message:message.trim(),history:history.slice(-10)})});history.push({role:'assistant',text:out.text||`${out.proposals?.length||0} action(s) proposée(s).`,source:out.mode==='mock'?'Simulation locale':out.model||'Assistant'});state=out.manifest||state;render()}catch(e){$('#composer-error').textContent=e.message}finally{sending=false;$('#composer').classList.remove('spinner')}}document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;render();document.querySelector('.shell').scrollTo({top:0,left:0});return}if(e.target.closest('[data-focus-composer]')){$('#composer-input').focus();return}const decision=e.target.closest('[data-decision]');if(decision){try{const out=await api(`/api/approvals/${encodeURIComponent(decision.dataset.proposal)}/decision`,{method:'POST',body:JSON.stringify({decision:decision.dataset.decision})});state=out.manifest;toast(decision.dataset.decision==='approve'?'Action appliquée':'Action refusée');render()}catch(err){toast(err.message)}return}const job=e.target.closest('[data-job]');if(job){try{const out=await api(`/api/jobs/${encodeURIComponent(job.dataset.job)}/transition`,{method:'POST',body:JSON.stringify({status:job.dataset.jobStatus})});state=out.manifest;render()}catch(err){toast(err.message)}}});$('#composer').addEventListener('submit',e=>{e.preventDefault();const input=$('#composer-input'),value=input.value;input.value='';sendMessage(value)});$('#composer-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});load().catch(e=>{$('#workspace').innerHTML=empty('Serveur indisponible',e.message,'Réessayer');$('#composer-error').textContent=e.message});
</script><script>
function renderScript(){const sequences=state.sequences||[],shots=state.shots||[];if(!sequences.length&&!shots.length)return header('Narration','Script & plans','Structurez le récit avant de générer les médias.')+empty('Aucune séquence','Demandez au copilote de découper le projet en séquences et en plans contrôlables.');return header('Narration','Script & plans',`${sequences.length} séquence(s), ${shots.length} plan(s).`)+list(sequences,s=>`<div class="item"><div class="item-main"><strong>${esc(s.title||s.id)}</strong><small>${esc(s.summary||'Sans résumé')}</small></div><span class="tag">${esc(s.id)}</span></div>`)+`<div class="section-title"><h2>Plans</h2></div>`+list(shots,s=>`<div class="item"><div class="item-main"><strong>${esc(s.title||s.id)}</strong><small>${esc(s.description||'Sans description')} · ${Math.round((s.durationMs||0)/100)/10} s</small></div><span class="tag">${esc(s.status||'draft')}</span></div>`)}
function renderProduction(){const js=jobs(),duration=Math.round((state.timeline?.durationMs||0)/100)/10;return header('Régie','Production','Les générations sont préparées, approuvées puis suivies ici.')+`<div class="grid"><div class="card"><div class="meta">Durée canonique</div><div class="metric">${duration} s</div></div><div class="card"><div class="meta">File de production</div><div class="metric">${js.length}</div></div></div><div class="section-title"><h2>Timeline commune</h2></div>${timeline()}<div class="section-title"><h2>File de production</h2></div>`+(js.length?list(js,j=>`<div class="item"><div class="item-main"><strong>${esc(j.label)} · ${esc(j.targetId)}</strong><small>${esc(j.status)} · ${esc(j.strategy)}</small></div>${['pending','running','review'].includes(j.status)?`<button class="btn" data-job="${esc(j.id)}" data-job-status="${j.status==='pending'?'running':j.status==='running'?'review':'succeeded'}">Avancer</button>`:''}</div>`):empty('Aucune génération en attente','Le copilote peut préparer une génération image, vidéo ou audio. Elle restera bloquée jusqu’à approbation.','Préparer une génération'))}
function renderAssets(kind,title,desc){const xs=(state.assets||[]).filter(a=>a.type===kind);return header('Bibliothèque',title,desc)+(xs.length?list(xs,a=>`<div class="item"><div class="item-main"><strong>${esc(a.name||a.id)}</strong><small>${esc(a.description||'Sans description')}</small></div><span class="tag">${esc(a.id)}</span></div>`):empty(`Aucun ${kind==='character'?'personnage':'décor'}`,`Ajoutez vos références ou demandez au copilote de définir les assets nécessaires.`,`Définir ${kind==='character'?'un personnage':'un décor'}`))}
function renderExport(){const duration=Math.round((state.timeline?.durationMs||0)/100)/10;return header('Livraison','Export','Cette vue lit la même timeline canonique que la production : aucune divergence silencieuse.')+`<div class="grid"><div class="card"><div class="meta">Durée</div><div class="metric">${duration} s</div></div><div class="card"><div class="meta">Statut</div><p>${jobs().some(j=>j.status!=='succeeded')?'Production incomplète':'Prêt pour contrôle final'}</p></div></div><div class="section-title"><h2>Pistes livrables</h2></div>${timeline()}<p class="muted">L’export YouTube et les rendus payants ne sont pas activés dans ce MVP.</p>`}
if(state)render();
</script></body></html>
